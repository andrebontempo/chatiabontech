services:
  ollama:
    image: ollama/ollama:latest
    container_name: chatiabontech_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: chatiabontech_web
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PORT=5000
    depends_on:
      - ollama
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

